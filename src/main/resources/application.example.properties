spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/sgte-db01?currentSchema=academico,documentos,public,sistema,tramites
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8080

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

spring.cloud.azure.storage.blob.container-name=archivos-sgra
spring.cloud.azure.storage.blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET}
jwt.expiration=1800000

whatsapp.service.url=http://localhost:7075
whatsapp.service.api-key=${WHATSAPP_API_KEY}

groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
groq.max-tokens=2048
groq.temperature=0.1
groq.timeout-seconds=10
